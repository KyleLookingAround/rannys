<svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coffee pouring into a mug" class="pour">
  <style>
    .pour .stream { transform-box: fill-box; transform-origin: top center; animation: pour-stream 4.2s ease-in-out infinite; }
    .pour .fill   { transform-box: fill-box; transform-origin: bottom center; animation: pour-fill 4.2s ease-in-out infinite; }
    .pour .jug    { transform-box: fill-box; transform-origin: 70% 80%; animation: pour-tip 4.2s ease-in-out infinite; }
    .pour .steam  { opacity: 0; animation: pour-steam 4.2s ease-in-out infinite; }
    .pour .steam.s2 { animation-delay: .35s; }
    @keyframes pour-stream {
      0%   { opacity: 0; transform: scaleY(0); }
      12%  { opacity: 1; transform: scaleY(1); }
      58%  { opacity: 1; transform: scaleY(1); }
      66%  { opacity: 0; transform: scaleY(1); }
      100% { opacity: 0; transform: scaleY(0); }
    }
    @keyframes pour-fill {
      0%   { transform: scaleY(0.06); }
      58%  { transform: scaleY(1); }
      92%  { transform: scaleY(1); }
      100% { transform: scaleY(0.06); }
    }
    @keyframes pour-tip {
      0%, 100% { transform: rotate(0deg); }
      12%, 62% { transform: rotate(-22deg); }
    }
    @keyframes pour-steam {
      0%, 60% { opacity: 0; transform: translateY(0); }
      78%     { opacity: .55; }
      100%    { opacity: 0; transform: translateY(-16px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pour .stream, .pour .fill, .pour .jug, .pour .steam { animation: none; }
      .pour .stream { opacity: 1; }
      .pour .fill { transform: none; }
      .pour .jug { transform: rotate(-22deg); }
      .pour .steam { opacity: .5; }
    }
  </style>

  <!-- steam -->
  <path class="steam s1" d="M96 70 q-8 -10 0 -20 q8 -10 0 -20" fill="none" stroke="#4a3220" stroke-width="3" stroke-linecap="round"/>
  <path class="steam s2" d="M118 70 q8 -10 0 -20 q-8 -10 0 -20" fill="none" stroke="#4a3220" stroke-width="3" stroke-linecap="round"/>

  <!-- pouring jug (tilts to pour) -->
  <g class="jug">
    <rect x="20" y="34" width="56" height="42" rx="12" fill="#c4612a" stroke="#2a1c10" stroke-width="3"/>
    <!-- spout -->
    <path d="M74 44 L98 52 L74 62 Z" fill="#c4612a" stroke="#2a1c10" stroke-width="3" stroke-linejoin="round"/>
    <!-- handle -->
    <path d="M20 44 q-16 0 -16 14 q0 14 16 14" fill="none" stroke="#2a1c10" stroke-width="3"/>
  </g>

  <!-- the pour stream -->
  <rect class="stream" x="104" y="60" width="7" height="58" rx="3.5" fill="#3a2415"/>

  <!-- mug -->
  <g>
    <!-- mug interior (clips the coffee fill) -->
    <clipPath id="mugInside"><rect x="74" y="118" width="72" height="58" rx="8"/></clipPath>
    <rect x="74" y="118" width="72" height="58" rx="8" fill="#f8f3e3"/>
    <!-- coffee, rises as it fills -->
    <rect class="fill" x="74" y="118" width="72" height="58" rx="8" fill="#3a2415" clip-path="url(#mugInside)"/>
    <!-- mug outline -->
    <rect x="74" y="118" width="72" height="58" rx="8" fill="none" stroke="#2a1c10" stroke-width="3"/>
    <!-- handle -->
    <path d="M146 132 q24 4 24 22 q0 18 -24 14" fill="none" stroke="#2a1c10" stroke-width="3"/>
    <!-- saucer -->
    <ellipse cx="110" cy="182" rx="58" ry="9" fill="#c5dd24" stroke="#2a1c10" stroke-width="3"/>
  </g>
</svg>
