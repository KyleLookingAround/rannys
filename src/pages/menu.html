<!-- PAGE HEADER -->
<section class="page-head">
  <div class="page-head-grid">
    <div>
      <div class="eyebrow">The Menu</div>
      <h1 class="page-title">What's <em>on.</em></h1>
      <p class="page-lede">{{shop.menuIntro}}</p>
      <p class="page-note">Prices in £. Oat, soya and coconut milk all in — no extra charge.</p>
    </div>
    <div class="pour-wrap">{{pourSvg}}</div>
  </div>
</section>

<!-- MENU (the real menu, as an image) -->
<section class="menu">
  <div class="menu-image-wrap">
    <img class="menu-image" src="{{shop.menuImage}}" alt="The {{shop.name}} menu — coffee, drinks and cakes with prices">
  </div>
  <p class="menu-fallback">Can't read it on your phone? <a href="mailto:{{shop.email}}">Drop us an email</a> or just pop in — we'll talk you through it.</p>
</section>

<!-- CTA strip -->
<section class="community">
  <span class="orbit o1">☕</span><span class="orbit o4">✺</span>
  <div class="community-inner">
    <h2>Come and <em>try it.</em></h2>
    <p>We're on Hempshaw Lane, {{shop.locality}}. Kettle's on.</p>
    <a class="btn" href="index.html#visit">Find us</a>
  </div>
</section>
