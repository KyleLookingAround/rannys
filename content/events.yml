  - date: 2026-12-09
    title: Ranny’s X Moon alchemy christmas pottery painting!
    when: Wednesday 9th December 6-8pm
    description: |-
      Join me for a relaxed, Christmassy pottery painting workshop at Rannys in Stockport on 9th December. Come solo, with your partner or with a friend!
      Everyone is welcome, whatever your skill level! No previous experience needed. I'll be there to guide you and help you every step of the way so you can create something beautiful to take home and keep as a lovely memory of the day. ❤️
      We'll be painting a selection of festive pottery, including:
      Porridge/soup bowls
      Christmas ornaments
      Santa and snowmen
      Christmas baubles
      Please bear in mind that there is limited availability of each design, so it's first come, first served! Whoever chooses a design first gets that option to paint.
      You can choose either one large piece or two small pieces to paint.
      Price: £35, including a hot chocolate or coffee if you fancy one. ☕️
      Your finished pottery will be ready to collect from Rannys within four weeks, or I can arrange postage to you at an additional cost.
      I can't wait to spend a lovely, creative and festive afternoon with you! 🎄✨
    soldOut: false
    poster: /assets/62d03709-e337-4664-9870-dfb33743cb95.jpeg
