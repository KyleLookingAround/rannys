  - date: 2026-11-23
    title: Christmas Wreath Making at Ranny's – Monday 23rd November, 7–9pm
    when: Monday 23rd November
    description: |-
      Have some festive fun with us as we gear up for Christmas with an evening of wreath making! Using gorgeous fresh foliages and natural decorations, imagine all the Christmas aromas — pine, spruce, dried oranges and cinnamon — all in the most beautiful mid-century setting that is Ranny's Café in Offerton.

      Date: Monday 23rd November
      Time: 7–9pm
      Location: Ranny's Café, Offerton, Stockport
      Price: £65 per person
      Spaces: Limited to 10
      All materials are included. Simply arrive, relax, and leave with a beautiful handmade wreath ready to hang on your door!
    soldOut: false
