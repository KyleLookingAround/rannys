# ════════════════════════════════════════════════════════════════════
#  RANNY'S  ·  site content
#
#  Edit the text inside the "quotes". Keep the labels (the word before
#  each colon) and the indentation exactly as they are (spaces, not tabs).
#  After editing, the site rebuilds itself on push (or run `npm run build`).
# ════════════════════════════════════════════════════════════════════

site:
  # The published web address (used for social-share + search metadata).
  # While the site lives on GitHub Pages this is the github.io URL; swap it
  # for your custom domain when you have one (and add a src/CNAME file).
  url: "https://kylelookingaround.github.io/rannys/"

shop:
  name: "Ranny's"
  description: "Independent coffee shop on Hempshaw Lane, Stockport. Good coffee, proper cake, no nonsense."
  priceRange: "££"

  # ── Address ────────────────────────────────────────────────────────
  street: "407 Hempshaw Lane"
  locality: "Stockport"
  region: "Greater Manchester"
  postcode: "SK1 4QA"
  country: "GB"

  # ── Contact + socials ──────────────────────────────────────────────
  email: "info@auntyrannys.com"
  instagramHandle: "@rannys407"
  instagram: "https://www.instagram.com/rannys407"
  facebook: "https://facebook.com/61583039575566"

  # ── Images (files live in the assets/ folder) ──────────────────────
  heroImage: "./assets/hero-bg.jpg"      # front-page background photo
  menuImage: "./assets/menu.jpg"         # (no longer used — the menu is now typeset from the list below)
  previewImage: "./assets/share-card.png"  # link-preview card (WhatsApp/Twitter/Facebook) — 1200×630

  # ── Opening status + hours ─────────────────────────────────────────
  statusShort: "Open Tue–Sun"          # the little pill, top-right of every page
  hoursShort: "Tue–Fri 7–4 · wknds 9–4" # short line in the hero
  hours:
    - day: "Tue – Fri"
      time: "7:00am – 4:00pm"
    - day: "Sat & Sun"
      time: "9:00am – 4:00pm"
    - day: "Monday"
      time: "Closed"
  # Same hours in the format Google/search engines read. Update if hours change.
  openingHours:
    - "Tu-Fr 07:00-16:00"
    - "Sa-Su 09:00-16:00"

  # ── Hero ───────────────────────────────────────────────────────────
  eyebrow: "Hempshaw Lane · Offerton, Stockport"
  tagline: "The little green coffee shop on Hempshaw Lane. Beans by Atkinsons of Lancaster, ridiculously good cake, and a warm room to linger in. No airs, no graces — just a good brew and a proper natter."

  # ── "Today" ticker on the home page — add or remove lines freely ───
  marquee:
    - "Beans by Atkinsons"
    - "Only Stockport bakes here"
    - "The Ranny's Special"
    - "Proper natters"
    - "Dog-friendly"
    - "Kettle's on"
    - "Craft sodas in the fridge"

  # ── Story (Rhianne's bit — in her own words) ───────────────────────
  story:
    name: "Rhianne"
    lede: "The girl covered in paint, fluffy socks and a half-ate butty in hand."
    paragraphs:
      - "I've spent most of my adult life on the SK1 hospitality scene — learning the ropes, pulling the pints, working out what makes a room actually feel good to be in."
      - "Ranny's is me taking the leap: a little green coffee shop on Hempshaw Lane that's properly my own. Beans by Atkinsons of Lancaster, ridiculously good cake, fresh flowers on the counter, and the kind of vintage charm that makes you want to stop a while."
      - "We've had the odd hiccup — locking ourselves out on a Saturday morning, *awkward* — but honestly, what a start. No airs, no graces, just a good brew and a warm welcome. Come and say hello."
    signature: "Ranny's x"

  # ── "What you'll find inside" — three cards ────────────────────────
  inside:
    - title: "Coffee, done right"
      body: "A medium-roast blend with milk-chocolate notes, by Atkinsons of Lancaster. Proper oat milk, dialled-in espresso, and a Ranny's Special worth ordering — our iced pistachio latte."
    - title: "Only Stockport bakes here"
      body: "Pastries fresh from Sticky Fingers every morning, cakes and cookies from Silver Apples — plus flourless and plant-based options. It changes with the day, so ask what's in."
    - title: "A room to linger in"
      body: "Speckled stoneware, fresh flowers, a wooden board menu, and walls in coffee shades — Milk & Honey and Roasted Hazelnut, finished with a smart border. Mismatched, much loved and dog-friendly — somewhere, not anywhere."

  # ── Partners ("from our friends") ──────────────────────────────────
  partners:
    - category: "Cakes & Bakes"
      name: "Silver Apples Bakery"
      url: "https://silverapplesbakery.com/"
      body: "The cakes and cookies on our stand — plus a proper variety of flourless and plant-based options for everyone."
    - category: "Pastries"
      name: "Sticky Fingers"
      url: "https://www.instagram.com/stickyfingersstockport/"
      body: "Pastries delivered fresh every morning — croissants, pain au chocolat, and the famous cinnamon rolls."

  # ── Community / "borrow the space" teaser ──────────────────────────
  community:
    blurb: "We're happy to lend the room. Book clubs, running crews, new-mum hangs, board-game nights — if you've got the people, we've got the room and the cake."

  # ── Featured quote band (photo + a line in her voice) ──────────────
  quote:
    text: "What a start. We honestly couldn't be prouder of the little place we've made."
    by: "Ranny's x"
    image: "./assets/interior.jpg"

  # ── Press / "as featured in" ───────────────────────────────────────
  #  Add outlets here as you get real links — the strip hides itself if empty.
  press:
    - { name: "Manchester's Finest", url: "https://www.manchestersfinest.com/places/rannys/" }

  # ════════════════════════════════════════════════════════════════
  #  MENU  (menu.html)
  #  This is the live menu — it's typeset straight onto the page. Add or
  #  remove sections and items below; `price` and `note` are optional on
  #  each item. (No image to re-export — just edit the text here.)
  # ════════════════════════════════════════════════════════════════
  menuIntro: "Beans by Atkinsons of Lancaster, made properly. Bakes from people who know what they're doing. No 17-word drink names — just the good stuff. Oat, soya and coconut milk all in."

  # ── House special (featured on the Menu page, with a photo) ────────
  special:
    name: "The Ranny's Special"
    blurb: "An iced latte combining Moma's pistachio-flavoured oat milk — dairy, gluten and nut free — a drop of Sip Syrups hazelnut, and our house espresso."
    image: "./assets/iced-special.jpg"

  menu:
    - name: "Coffee"
      note: "A medium-roast blend with milk-chocolate notes, by Atkinsons of Lancaster. Decaf on request."
      items:
        - { name: "Espresso", price: "£2.40" }
        - { name: "Macchiato", price: "£2.60" }
        - { name: "Cortado", price: "£3.00" }
        - { name: "Flat white", price: "£3.20" }
        - { name: "Latte", price: "£3.40" }
        - { name: "Cappuccino", price: "£3.40" }
        - { name: "Americano", price: "£3.00" }
        - { name: "Mocha", price: "£3.60" }
        - { name: "Extra shot", note: "add to any", price: "£0.50" }
    - name: "Not coffee"
      items:
        - { name: "Hot chocolate", price: "£3.40" }
        - { name: "Chai latte", price: "£3.60" }
        - { name: "Matcha latte", price: "£3.80" }
        - { name: "Loose-leaf tea", price: "£2.80" }
        - { name: "Babyccino", note: "for the little ones", price: "£1.00" }
    - name: "Iced & cold"
      note: "Craft sodas in the fridge too — Living Things, Posh Pop & more."
      items:
        - { name: "The Ranny's Special", note: "iced latte · Moma's pistachio oat milk (df/gf/nf) · Sip Syrups hazelnut · house espresso", price: "£4.20" }
        - { name: "Iced latte", price: "£3.60" }
        - { name: "Iced matcha", price: "£3.90" }
        - { name: "Cold brew", price: "£3.60" }
    - name: "Cake & bakes"
      note: "From Silver Apples Bakery. Changes with the day — ask what's in."
      items:
        - { name: "Brownie", price: "£3.50" }
        - { name: "Blondie", price: "£3.50" }
        - { name: "Cookie", price: "£2.80" }
        - { name: "Traybake of the day", price: "£3.50" }

  # ════════════════════════════════════════════════════════════════
  #  EVENTS  (events.html)
  #  Add a block per event. Leave the list empty to show a "nothing on" note.
  #  These are EXAMPLES — edit or delete them.
  # ════════════════════════════════════════════════════════════════
  eventsIntro: "We put the odd thing on — nothing fancy, just good reasons to come in. Here's what's coming up."
  #  Each event needs a `date` (YYYY-MM-DD) — the day/month pill is made from
  #  it, and once it's passed the site fades the event for a week (links off),
  #  then hides it automatically. List them in date order.
  events:
    - date: "2026-06-30"
      title: "Pop-Up Shop — Ranny's × Mardy"
      when: "Tue 30 June · 10am–1pm · free in"
      description: "Cool kids' vintage clothes & accessories with Mardy Kids Vintage, popping up here at Ranny's. Don't be basic. First ten customers through the door get a free coffee — just show the flyer to redeem."
      link: "https://www.instagram.com/mardykidsvintage"
      linkText: "Mardy Kids Vintage on Instagram"
    - date: "2026-07-23"
      title: "Make a Mug — Pottery Workshop"
      when: "Thu 23 July · 7pm · £40 · with Frank's Studio"
      description: "Throw your very own mug with Frank's Studio, right here at Ranny's. £40 includes everything you need — and a free coffee in your new mug when you come to collect it. Ran by the lovely folk at Frank's Studio."
      soldOut: true
      link: "https://www.franksstudio.co.uk/product-page/ranny-s-stockport-workshops"
      linkText: "Workshop details at Frank's Studio"

  # ════════════════════════════════════════════════════════════════
  #  PHOTOS  (photos.html)
  #  Drop your photos into the assets/ folder and point "src" at them,
  #  e.g.  src: "./assets/inside-1.jpg". Until then these show a placeholder.
  # ════════════════════════════════════════════════════════════════
  photosIntro: "A few snaps of the place and the good stuff. Pop in and see the real thing."
  photos:
    - { src: "./assets/storefront.jpg", caption: "our little green shop" }
    - { src: "./assets/preview.jpg", caption: "the famous pistachio donut" }
    - { src: "./assets/menu.jpg", caption: "it's cor-tad-o not cor-tar-do, we know that now" }
    - { src: "./assets/iced-special.jpg", caption: "the Ranny's Special, over ice" }
    - { src: "./assets/biscoff.jpg", caption: "cake o'clock" }
    - { src: "./assets/window-seats.jpg", caption: "grab a window seat" }

  # ════════════════════════════════════════════════════════════════
  #  BOOKINGS  (bookings.html)
  # ════════════════════════════════════════════════════════════════
  bookingsIntro: "Want the place to yourself, or a corner for your group? Tell us what you're after and we'll sort it. Straight answers, no faff."
  bookingTypes:
    - title: "Private hire"
      body: "Have the whole shop after hours for a get-together, a launch, or a do. We'll talk numbers, food and timings with you."
    - title: "Group meet-ups"
      body: "Book clubs, knit nights, running crews, new-mum hangs — a reserved corner and a standing welcome. Often free; just ask."
    - title: "Celebrations"
      body: "Birthdays, baby showers, a quiet wake. A warm room, good coffee and cake sorted — you bring the people."

  # ── Mailing list ("on the list") ───────────────────────────────────
  # For now this is a one-tap email. To switch to a proper subscribe form,
  # paste your provider's form action URL into "action" (Buttondown / Formspree
  # / Mailchimp etc.) and set fieldName ("email", or "EMAIL" for Mailchimp).
  mailingList:
    blurb: "Now and then we'll send a quick note — new things on the menu, events worth turning up for. That's it."
    action: ""
    fieldName: "email"
